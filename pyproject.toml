[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbom-trust-manager"
version = "0.1.0"
description = "Hash an SBOM file and write or check a signature bundle: a mock mode for the format, or cosign for a real signature. Prototype."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "James Thornton"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.10",
    "mypy>=1.0",
]

[project.scripts]
sbom-trust = "sbom_trust.cli.main:app"

[project.urls]
Homepage = "https://github.com/cyber-physical-engineering/sbom-trust-manager"
Documentation = "https://github.com/cyber-physical-engineering/sbom-trust-manager#readme"
Repository = "https://github.com/cyber-physical-engineering/sbom-trust-manager"
Issues = "https://github.com/cyber-physical-engineering/sbom-trust-manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["sbom_trust"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.9"
strict = true

