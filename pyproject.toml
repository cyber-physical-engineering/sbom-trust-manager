[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbom-trust-manager"
version = "0.1.0"
description = "Cryptographically sign and verify Software Bills of Materials (SBOM) for supply chain security."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Big Data Plumbing", email = "contact@bigdataplumbing.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
sbom-trust = "sbom_trust.cli.main:app"

[project.urls]
Homepage = "https://github.com/bigdataplumbing/sbom-trust-manager"
Documentation = "https://github.com/bigdataplumbing/sbom-trust-manager#readme"
Repository = "https://github.com/bigdataplumbing/sbom-trust-manager"
Issues = "https://github.com/bigdataplumbing/sbom-trust-manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["sbom_trust"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

